version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/modules/identity/internal/adapter/postgres/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "postgres"
        out: "internal/modules/identity/internal/adapter/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "*time.Time"
            nullable: true
  - engine: "postgresql"
    queries: "internal/modules/task/internal/adapter/postgres/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "postgres"
        out: "internal/modules/task/internal/adapter/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "*time.Time"
            nullable: true
